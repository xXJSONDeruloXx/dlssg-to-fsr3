name: Build dlssg-to-fsr3

on:
  push:
    branches: [ main, build, develop ]
  pull_request:
    branches: [ main, build, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up VS2022 environment
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        echo PATH=%PATH% >> %GITHUB_ENV%
        echo INCLUDE=%INCLUDE% >> %GITHUB_ENV%
        echo LIB=%LIB% >> %GITHUB_ENV%
        echo LIBPATH=%LIBPATH% >> %GITHUB_ENV%

    - name: Set up vcpkg
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.309.0
        cache: true

    - name: Install WinPixEventRuntime
      shell: pwsh
      run: |
        # Install WinPixEventRuntime via NuGet
        dotnet add package WinPixEventRuntime --version 1.0.240308001
        
        # Also download the DLL directly if needed
        $pixUrl = "https://www.nuget.org/api/v2/package/WinPixEventRuntime/1.0.240308001"
        $pixZip = "$env:TEMP\WinPixEventRuntime.zip"
        $pixDir = "$env:TEMP\WinPixEventRuntime"
        
        Invoke-WebRequest -Uri $pixUrl -OutFile $pixZip
        Expand-Archive -Path $pixZip -DestinationPath $pixDir -Force
        
        # Copy the DLL to the expected location
        $dllSource = "$pixDir\runtimes\win-x64\native\WinPixEventRuntime.dll"
        $dllTarget = "${{ github.workspace }}\dependencies\FidelityFX-SDK\sdk\libs\pix\bin\x64\WinPixEventRuntime.dll"
        
        if (Test-Path $dllSource) {
          New-Item -ItemType Directory -Path (Split-Path $dllTarget -Parent) -Force
          Copy-Item -Path $dllSource -Destination $dllTarget -Force
          Write-Host "WinPixEventRuntime.dll copied to: $dllTarget"
        } else {
          Write-Host "WinPixEventRuntime.dll not found in package, continuing without it"
        }

    - name: Build and set up FidelityFX SDK
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        echo "Updating FidelityFX SDK submodules..."
        cd dependencies\FidelityFX-SDK
        git submodule update --init --recursive
        cd ..\..
        echo "Building FidelityFX SDK..."
        ${{ github.workspace }}\dependencies\Build-FFX-SDK.bat
        echo "Verifying FidelityFX SDK build outputs..."
        dir ${{ github.workspace }}\dependencies\FidelityFX-SDK\sdk\bin\ffx_sdk\

    - name: Build dlssg-to-fsr3 (Universal Release only for CI)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        echo "Checking required files before build..."
        if not exist "${{ github.workspace }}\dependencies\FidelityFX-SDK\sdk\bin\ffx_sdk\ffx_backend_dx12_x64.lib" (
          echo "ERROR: ffx_backend_dx12_x64.lib not found!"
          echo "FidelityFX SDK build may have failed. Listing contents:"
          dir ${{ github.workspace }}\dependencies\FidelityFX-SDK\sdk\bin\ /s
          exit /b 1
        )
        echo "Required files found, proceeding with build..."
        cmake --preset final-universal
        cmake --build --preset final-universal-release
        echo "Build completed, creating package..."
        cpack --preset final-universal

    - name: Upload CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'dlssg-to-fsr3-ci-build'
        path: |
          ${{ github.workspace }}\bin\built-packages\*.zip
        if-no-files-found: error
        retention-days: 7
