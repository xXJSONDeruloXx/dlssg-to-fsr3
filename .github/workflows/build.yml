name: Build dlssg-to-fsr3

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        variant: [universal, nvngxwrapper, dtwrapper]
        config: [Debug, Release]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '53bef8994c541b6561884a8395ea35715ece75db'

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.1.1
      with:
        version: latest
        cache: true

    - name: Cache FidelityFX SDK build
      uses: actions/cache@v4
      with:
        path: dependencies/FidelityFX-SDK/sdk/bin
        key: fidelityfx-sdk-${{ runner.os }}-${{ hashFiles('dependencies/FidelityFX-SDK/**/*.cmake', 'dependencies/FidelityFX-SDK/**/*.bat') }}
        restore-keys: |
          fidelityfx-sdk-${{ runner.os }}-

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Create CMakeUserEnvVars.json
      shell: pwsh
      run: |
        $envVars = @{
          "configurePresets" = @(
            @{
              "name" = "config-envvars"
              "hidden" = $true
              "cacheVariables" = @{
                "GAME_ROOT_DIRECTORY" = "C:/temp/game"
                "GAME_DEBUGGER_CMDLINE" = "C:/temp/game/game.exe"
              }
            }
          )
        }
        $envVars | ConvertTo-Json -Depth 10 | Out-File -FilePath "CMakeUserEnvVars.json" -Encoding UTF8

    - name: Build FidelityFX SDK
      shell: cmd
      run: |
        cd dependencies\FidelityFX-SDK\sdk
        if not exist "bin\ffx_sdk" call BuildFidelityFXSDK.bat
        if not exist "bin\ffx_sdk" (
          echo "FidelityFX SDK build failed"
          exit /b 1
        )

    - name: Configure CMake
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'final-${{ matrix.variant }}'

    - name: Build
      uses: lukka/run-cmake@v10
      with:
        buildPreset: 'final-${{ matrix.variant }}-${{ matrix.config }}'

    - name: Package (Release only)
      if: matrix.config == 'Release'
      shell: pwsh
      run: |
        cpack --preset final-${{ matrix.variant }}

    - name: List build outputs (Debug)
      if: always()
      shell: pwsh
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Recurse bin/final-${{ matrix.variant }} -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

    - name: Upload build artifacts
      if: matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: dlssg-to-fsr3-${{ matrix.variant }}-${{ matrix.config }}
        path: bin/built-packages/*.zip
        retention-days: 30

    - name: Upload debug artifacts
      if: matrix.config == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: dlssg-to-fsr3-${{ matrix.variant }}-${{ matrix.config }}-binaries
        path: |
          bin/final-${{ matrix.variant }}/${{ matrix.config }}/*.dll
          bin/final-${{ matrix.variant }}/${{ matrix.config }}/*.pdb
        retention-days: 7

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: dlssg-to-fsr3-*-Release
        merge-multiple: true

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: '*.zip'
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
