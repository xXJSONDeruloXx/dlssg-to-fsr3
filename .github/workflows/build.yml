name: Build dlssg-to-fsr3

on:
  push:
    branches: [ main, build, develop ]
  pull_request:
    branches: [ main, build, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_FEATURE_FLAGS: dependencygraph
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up GitHub Actions cache environment
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set up Vcpkg environment
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

    - name: Set up VS2022 toolset
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install and set up Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.1.1
      with:
        version: latest
        cache: false

    - name: Build and set up FidelityFX SDK
      shell: cmd
      run: |
        ${{ github.workspace }}/dependencies/Build-FFX-SDK.bat

    - name: Build dlssg-to-fsr3 (Universal Release only for CI)
      shell: pwsh
      run: |
        # Just build universal release for CI speed
        cmake --preset final-universal
        cmake --build --preset final-universal-Release
        cpack --preset final-universal

    - name: Upload CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'dlssg-to-fsr3-ci-build'
        path: |
          ${{ github.workspace }}/bin/built-packages/*.zip
        if-no-files-found: error
        retention-days: 7
