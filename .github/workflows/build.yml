name: Build dlssg-to-fsr3

on:
  push:
    branches: [ main, build, develop ]
  pull_request:
    branches: [ main, build, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up VS2022 environment
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        echo PATH=%PATH% >> %GITHUB_ENV%
        echo INCLUDE=%INCLUDE% >> %GITHUB_ENV%
        echo LIB=%LIB% >> %GITHUB_ENV%
        echo LIBPATH=%LIBPATH% >> %GITHUB_ENV%

    - name: Set up vcpkg
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $vulkanVersion = "1.3.290.0"
        $vulkanUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
        $vulkanInstaller = "$env:TEMP\VulkanSDK-Installer.exe"
        $vulkanPath = "C:\VulkanSDK\$vulkanVersion"
        
        # Check if already installed
        if (Test-Path "$vulkanPath\Bin\vulkaninfo.exe") {
          Write-Host "Vulkan SDK already installed at $vulkanPath"
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
          return
        }
        
        Write-Host "Downloading Vulkan SDK $vulkanVersion..."
        $ProgressPreference = 'SilentlyContinue'  # Disable progress bar for faster download
        Invoke-WebRequest -Uri $vulkanUrl -OutFile $vulkanInstaller -TimeoutSec 300
        
        if (-not (Test-Path $vulkanInstaller)) {
          throw "Failed to download Vulkan SDK installer"
        }
        
        $fileSize = (Get-Item $vulkanInstaller).Length / 1MB
        Write-Host "Downloaded installer: $([math]::Round($fileSize, 2)) MB"
        
        Write-Host "Installing Vulkan SDK (this may take 2-5 minutes)..."
        $process = Start-Process -FilePath $vulkanInstaller -ArgumentList @("/S") -Wait -PassThru
        
        if ($process.ExitCode -ne 0) {
          throw "Vulkan SDK installation failed with exit code: $($process.ExitCode)"
        }
        
        # Verify installation
        if (Test-Path "$vulkanPath\Bin\vulkaninfo.exe") {
          Write-Host "Vulkan SDK installed successfully at $vulkanPath"
          echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
        } else {
          throw "Vulkan SDK installation verification failed - vulkaninfo.exe not found"
        }

    - name: Build and set up FidelityFX SDK
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        ${{ github.workspace }}\dependencies\Build-FFX-SDK.bat

    - name: Build dlssg-to-fsr3 (Universal Release only for CI)
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --preset final-universal
        cmake --build --preset final-universal-Release
        cpack --preset final-universal

    - name: Upload CI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'dlssg-to-fsr3-ci-build'
        path: |
          ${{ github.workspace }}\bin\built-packages\*.zip
        if-no-files-found: error
        retention-days: 7
