name: Release dlssg-to-fsr3

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_FEATURE_FLAGS: dependencygraph
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-and-release:
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up GitHub Actions cache environment
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set up Vcpkg environment
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

    - name: Set up VS2022 toolset
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install and set up Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.1.1
      with:
        version: latest
        cache: false

    - name: Build and set up FidelityFX SDK
      shell: cmd
      run: |
        ${{ github.workspace }}/dependencies/Build-FFX-SDK.bat

    - name: Build dlssg-to-fsr3
      shell: pwsh
      run: |
        ${{ github.workspace }}/Make-Release.ps1

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'dlssg-to-fsr3-release'
        path: |
          ${{ github.workspace }}/bin/built-packages/*.zip
        if-no-files-found: error

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: always() && needs.build-and-release.result == 'success'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        name: dlssg-to-fsr3-release

    - name: Get tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Release ${{ steps.tag.outputs.tag }}
        files: '*.zip'
        draft: false
        prerelease: false
        body: |
          ## dlssg-to-fsr3 ${{ steps.tag.outputs.tag }}
          
          This release includes:
          - **Universal Edition**: Drop-in replacement DLLs (version.dll, winhttp.dll, dbghelp.dll)
          - **NVNGX Edition**: Direct nvngx.dll replacement (requires registry modification)
          - **DLSSTweaks Edition**: Compatible with DLSSTweaks mod
          
          ### Installation Instructions
          
          Please refer to the README.md for detailed installation instructions for each edition.
          
          ### Compatibility
          
          - **Supported GPUs**: RTX 1600, RTX 2000, RTX 3000 series
          - **Game Compatibility**: Check the [Game Compatibility List](https://github.com/Nukem9/dlssg-to-fsr3/wiki/Game-Compatibility-List)
          - **Warning**: Not recommended for multiplayer games due to potential account bans
          
          ### What's New
          
          See the CHANGELOG section in README.md for detailed changes in this release.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
